[project]
name = "mealie_mcp"
version = "0.1.0"
description = "A Model Context Protocol server for Mealie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=0.5.0",  # standalone FastMCP library
    "click>=8.1.7",    # explicit since mcp[cli] provided it before
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]


[project.scripts]
mealie_mcp = "mealie_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.uv-build]
# Use conventional src/ layout
module-root = "src"